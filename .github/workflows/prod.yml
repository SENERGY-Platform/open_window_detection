name: 'PROD build'

# master is the v1 line: it builds :prod as before plus :v1.x.y. The v2 line lives on
# release/v2 with its own workflow (v2.yml). The git tag is pushed after the image, so a
# failed build never consumes a version.
on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  multi:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v2
        with:
          fetch-depth: 0
      - name: Version
        id: version
        run: echo "tag=$(.github/scripts/next-version.sh "$GITHUB_REF_NAME")" >> "$GITHUB_OUTPUT"
      - name: Image tags
        id: tags
        run: |
          {
            echo 'list<<EOF'
            echo "ghcr.io/senergy-platform/open_window_detection:${{ steps.version.outputs.tag }}"
            if [ "$GITHUB_REF_NAME" = 'master' ]; then
              echo 'ghcr.io/senergy-platform/open_window_detection:prod'
            fi
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
      - name: Login to DockerHub
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v1
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.CR_PAT }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1
      - name: Build and push
        uses: docker/build-push-action@v2
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm/v6,linux/arm/v7,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.list }}
      - name: Push version tag
        run: |
          tag='${{ steps.version.outputs.tag }}'
          if [ -z "$(git tag --points-at HEAD --list "$tag")" ]; then
            git tag "$tag"
            git push origin "$tag"
          fi
