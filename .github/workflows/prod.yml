name: 'PROD build'

# master builds an immutable :vX.Y.Z image, the version the platform registers from the manifest at that tag. No
# :prod and no :v2.0: deployments of the older lines keep their images. release/v2 builds its own :v2.x.y with the
# workflow on that branch. The git tag is pushed after the image, so a failed build never consumes a version.
on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install uv==0.11.16 && uv sync --locked
      - name: Test
        run: uv run --locked python -m unittest discover -s tests -t .

  build:
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # The platform registers a version from the manifest at its tag, so the manifest is
      # regenerated and committed before the version is computed, built and tagged.
      - name: Regenerate the operator manifest
        run: |
          python -m pip install uv==0.11.16
          uv sync --locked
          uv run --locked python -m operator_lib manifest main.py
          if [ -n "$(git status --porcelain -- operator-manifest.json)" ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add operator-manifest.json
            git commit -m 'chore: regenerate the operator manifest [skip ci]'
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
      - name: Version
        id: version
        run: |
          echo "tag=$(.github/scripts/next-version.sh "$GITHUB_REF_NAME")" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.CR_PAT }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: GIT_COMMIT=${{ steps.version.outputs.commit }}
          tags: ghcr.io/senergy-platform/open_window_detection:${{ steps.version.outputs.tag }}
      - name: Push version tag
        run: |
          tag='${{ steps.version.outputs.tag }}'
          if [ -z "$(git tag --points-at HEAD --list "$tag")" ]; then
            git tag "$tag"
            git push origin "$tag"
          fi
